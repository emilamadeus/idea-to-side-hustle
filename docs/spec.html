    updated    ISO date of last change to this task.

- Add one entry to "log" per working session: date + what changed, plain words.
- Update "project.updated" on every edit.

<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --fg: #15171c; --muted: #6a6f7d; --line: #e4e4de;
    --done: #1f9d63; --active: #2d6cdf; --todo: #8a8f9c; --blocked: #d4482c; --wait: #b7860b;
    --chip: #efefea; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter Tight', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0e13; --panel: #13161d; --fg: #e9ecf3; --muted: #8b92a5; --line: #222632;
      --done: #3ccf8e; --active: #5b9bff; --todo: #7c8396; --blocked: #ff6b4a; --wait: #f0b93a;
      --chip: #1b1f29; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0e13; --panel: #13161d; --fg: #e9ecf3; --muted: #8b92a5; --line: #222632;
    --done: #3ccf8e; --active: #5b9bff; --todo: #7c8396; --blocked: #ff6b4a; --wait: #f0b93a;
    --chip: #1b1f29; --shadow: none;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }

  header { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; margin-bottom: 28px; }
  h1 { font-size: 34px; font-weight: 700; letter-spacing: -.025em; line-height: 1.05; }
  .sub { color: var(--muted); margin-top: 6px; }
  .meta { text-align: right; font: 13px var(--mono); color: var(--muted); }
  .meta b { display: block; font: 700 30px var(--sans); color: var(--fg); letter-spacing: -.02em; }

  .bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--chip); margin-bottom: 10px; }
  .bar i { display: block; height: 100%; transition: width .6s; }
  .counts { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .counts button {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-radius: 99px; background: var(--chip); font-size: 13px; color: var(--muted);
  }
  .counts button b { color: var(--fg); font-weight: 600; }
  .counts button.on { background: var(--fg); color: var(--bg); }
  .counts button.on b { color: var(--bg); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .toolbar input {
    flex: 1; min-width: 200px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--fg); font: inherit;
  }
  .seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; }
  .seg button, .tbtn {
    all: unset; cursor: pointer; padding: 6px 12px; border-radius: 8px; font-size: 13px; color: var(--muted);
  }
  .seg button.on { background: var(--panel); color: var(--fg); box-shadow: var(--shadow); }
  .tbtn:hover { color: var(--fg); }

  .group { margin-top: 26px; }
  .group h2 { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin-bottom: 10px; display: flex; gap: 10px; }
  .group h2 span { color: var(--fg); }

  .task { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; box-shadow: var(--shadow); transition: border-color .2s; }
  .task.flash { border-color: var(--active); }
  .row { display: grid; grid-template-columns: 22px 52px 1fr auto auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
  .chev { color: var(--muted); transition: transform .2s; font-size: 12px; text-align: center; }
  .task.open .chev { transform: rotate(90deg); }
  .id { font: 500 12px var(--mono); color: var(--muted); }
  .ttl { font-weight: 600; min-width: 0; }
  .ttl small { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font: 500 11.5px var(--mono); padding: 3px 9px; border-radius: 99px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
  .pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .s-done { color: var(--done); background: color-mix(in srgb, var(--done) 12%, transparent); }
  .s-active { color: var(--active); background: color-mix(in srgb, var(--active) 12%, transparent); }
  .s-todo, .s-ready { color: var(--todo); background: color-mix(in srgb, var(--todo) 12%, transparent); }
  .s-blocked { color: var(--blocked); background: color-mix(in srgb, var(--blocked) 12%, transparent); }
  .s-waiting { color: var(--wait); background: color-mix(in srgb, var(--wait) 12%, transparent); }
  .copy {
    all: unset; cursor: pointer; font: 500 12px var(--mono); color: var(--muted);
    padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line);
  }
  .copy:hover { color: var(--fg); border-color: var(--muted); }
  .copy.ok { color: var(--done); border-color: var(--done); }

  .body { display: none; padding: 0 16px 16px 100px; }
  .task.open .body { display: block; }
  .reason { border-left: 3px solid var(--blocked); padding: 6px 12px; margin-bottom: 12px; background: color-mix(in srgb, var(--blocked) 7%, transparent); border-radius: 0 8px 8px 0; }
  .reason.wait { border-color: var(--wait); background: color-mix(in srgb, var(--wait) 7%, transparent); }
  .details { color: var(--fg); }
  .details p, .details ul { margin-bottom: 8px; }
  .details ul { padding-left: 18px; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; margin-top: 10px; font-size: 13.5px; }
  .kv dt { color: var(--muted); font: 12px var(--mono); padding-top: 2px; }
  .dep { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; font: 12px var(--mono); padding: 2px 8px; border-radius: 6px; background: var(--chip); margin: 0 4px 4px 0; }
  .dep:hover { outline: 1px solid var(--muted); }
  .dep i { width: 7px; height: 7px; border-radius: 50%; }

  #graph { display: none; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  body.view-graph #graph { display: block; }
  body.view-graph #list { display: none; }
  #graph svg { display: block; }
  #graph .node { cursor: pointer; }
  #graph .node rect { fill: var(--panel); stroke-width: 1.5; }
  #graph .node:hover rect { stroke-width: 2.5; }
  #graph .node text { fill: var(--fg); font: 12px var(--sans); }
  #graph .node text.nid { fill: var(--muted); font: 10.5px var(--mono); }
  #graph path { fill: none; stroke: var(--line); stroke-width: 1.5; }
  #graph path.hot { stroke: var(--muted); }
  #graph .col { fill: var(--muted); font: 10.5px var(--mono); letter-spacing: .1em; }

  .log { margin-top: 40px; }
  .log li { list-style: none; display: grid; grid-template-columns: 100px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .log time { font: 12px var(--mono); color: var(--muted); padding-top: 2px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }

  @media (max-width: 640px) {
    header { grid-template-columns: 1fr; }
    .meta { text-align: left; }
    .row { grid-template-columns: 16px 1fr auto; }
    .row .id, .row .copy { display: none; }
    .body { padding: 0 14px 14px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="name"></h1><div class="sub" id="subtitle"></div></div>
    <div class="meta"><b id="days"></b><span id="deadline"></span><br /><span id="updated"></span></div>
  </header>

  <div class="bar" id="bar"></div>
  <div class="counts" id="counts"></div>

  <div class="toolbar">
    <input id="q" type="search" placeholder="Filter tasks" />
    <div class="seg" id="view">
      <button data-v="list" class="on">List</button>
      <button data-v="graph">Dependencies</button>
    </div>
    <button class="tbtn" id="expand">Expand all</button>
    <button class="tbtn" id="copyall">Copy summary</button>
  </div>

  <div id="list"></div>
  <div id="graph"></div>

  <section class="log"><div class="group"><h2>Log</h2></div><ul id="log"></ul></section>
</div>

<script>
(() => {
  const data = JSON.parse(document.getElementById('spec-data').textContent);
  const { project, groups, tasks, log } = data;
  const byId = Object.fromEntries(tasks.map((t) => [t.id, t]));
  const LABEL = { done: 'Done', active: 'In progress', todo: 'To do', ready: 'Ready', blocked: 'Blocked', waiting: 'Waiting' };
  const COLOR = { done: '--done', active: '--active', todo: '--todo', ready: '--todo', blocked: '--blocked', waiting: '--wait' };
  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem('spec:' + k)) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem('spec:' + k, JSON.stringify(v)); } catch {} },
  };

  // Effective status: todo with unfinished deps -> waiting; todo with all deps done -> ready.
  const openDeps = (t) => (t.deps || []).filter((d) => byId[d] && byId[d].status !== 'done');
  const eff = (t) => {
    if (t.status !== 'todo') return t.status;
    return openDeps(t).length ? 'waiting' : 'ready';
  };
  const dependents = (id) => tasks.filter((t) => (t.deps || []).includes(id));

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const strip = (html) => { const d = document.createElement('div'); d.innerHTML = html || ''; return d.innerText.trim(); };

  // ---------- header ----------
  document.getElementById('name').textContent = project.name;
  document.getElementById('subtitle').textContent = project.subtitle;
  const dl = new Date(project.deadline + 'T09:00:00');
  const days = Math.ceil((dl - new Date()) / 864e5);
  document.getElementById('days').textContent = days > 0 ? `${days} days` : days === 0 ? 'Today' : 'Past';
  document.getElementById('deadline').textContent = 'to ' + dl.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('updated').textContent = 'updated ' + project.updated;

  // ---------- counts + bar ----------
  const order = ['done', 'active', 'ready', 'waiting', 'blocked'];
  const counts = Object.fromEntries(order.map((s) => [s, 0]));
  tasks.forEach((t) => counts[eff(t)]++);
  document.getElementById('bar').innerHTML = order.map((s) =>
    `<i style="width:${counts[s] / tasks.length * 100}%;background:var(${COLOR[s]})" title="${LABEL[s]}: ${counts[s]}"></i>`).join('');

  let filter = store.get('filter', 'all');
  const countsEl = document.getElementById('counts');
  const renderCounts = () => {
    countsEl.innerHTML = [`<button data-f="all" class="${filter === 'all' ? 'on' : ''}">All <b>${tasks.length}</b></button>`]
      .concat(order.map((s) => `<button data-f="${s}" class="${filter === s ? 'on' : ''}"><span class="pill s-${s}" style="padding:0;background:none"></span>${LABEL[s]} <b>${counts[s]}</b></button>`)).join('');
  };
  countsEl.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    filter = b.dataset.f; store.set('filter', filter); renderCounts(); renderList();
  });

  // ---------- status text for copy ----------
  function statusText(t) {
    const s = eff(t);
    const lines = [`${t.title} (${t.id}): ${LABEL[s]}`];
    lines.push(t.summary);
    if (s === 'blocked' && t.blocked) lines.push(`Blocked: ${t.blocked}`);
    const od = openDeps(t);
    if (od.length) lines.push(`Waiting on: ${od.map((d) => `${byId[d].title} (${LABEL[eff(byId[d])].toLowerCase()})`).join(', ')}`);
    const unblocks = dependents(t.id);
    if (unblocks.length && s !== 'done') lines.push(`Unblocks: ${unblocks.map((d) => d.title).join(', ')}`);
    if (t.next) lines.push(`Next: ${t.next}`);
    lines.push(`Owner: ${t.owner}. Updated ${t.updated}.`);
    return lines.join('\n');
  }
  function summaryText() {
    const by = (s) => tasks.filter((t) => eff(t) === s);
    const part = (s) => by(s).length ? `${LABEL[s]} (${by(s).length}): ${by(s).map((t) => t.title).join('; ')}` : '';
    return [
      `${project.name}: ${counts.done}/${tasks.length} tasks done, ${days} days to ${project.deadline}.`,
      part('active'), part('blocked'),
      by('blocked').map((t) => `  ${t.title}: ${t.blocked}`).join('\n'),
    ].filter(Boolean).join('\n');
  }
  async function copy(text, btn) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const ta = Object.assign(document.createElement('textarea'), { value: text });
      document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    const old = btn.textContent; btn.textContent = 'Copied'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('ok'); }, 1400);
  }

  // ---------- list ----------
  const open = new Set(store.get('open', []));
  const list = document.getElementById('list');
  const q = document.getElementById('q');

  function depChip(id) {
    const d = byId[id]; if (!d) return '';
    return `<button class="dep" data-go="${id}"><i style="background:var(${COLOR[eff(d)]})"></i>${id} ${esc(d.title)}</button>`;
  }

  function renderList() {
    const term = q.value.trim().toLowerCase();
    const match = (t) => (filter === 'all' || eff(t) === filter) &&
      (!term || [t.id, t.title, t.summary, strip(t.details), t.blocked, t.next].join(' ').toLowerCase().includes(term));
    const html = groups.map((g) => {
      const ts = tasks.filter((t) => t.group === g.id && match(t));
      if (!ts.length) return '';
      const done = tasks.filter((t) => t.group === g.id && t.status === 'done').length;
      const all = tasks.filter((t) => t.group === g.id).length;
      return `<section class="group"><h2>${esc(g.name)} <span>${done}/${all}</span></h2>${ts.map(card).join('')}</section>`;
    }).join('');
    list.innerHTML = html || '<div class="empty">No tasks match.</div>';
  }

  function card(t) {
    const s = eff(t);
    const od = openDeps(t);
    const unblocks = dependents(t.id);
    return `<article class="task ${open.has(t.id) ? 'open' : ''}" id="t-${t.id}" data-id="${t.id}">
      <div class="row">
        <span class="chev">▶</span>
        <span class="id">${t.id}</span>
        <span class="ttl">${esc(t.title)}<small>${esc(t.summary)}</small></span>
        <span class="pill s-${s}">${LABEL[s]}</span>
        <button class="copy" data-copy="${t.id}" title="Copy status for this task">Copy status</button>
      </div>
      <div class="body">
        ${s === 'blocked' && t.blocked ? `<div class="reason"><b>Blocked:</b> ${esc(t.blocked)}</div>` : ''}
        ${s === 'waiting' ? `<div class="reason wait"><b>Waiting on:</b> ${od.map((d) => esc(byId[d].title)).join(', ')}</div>` : ''}
        <div class="details">${t.details || ''}</div>
        <dl class="kv">
          ${t.next ? `<dt>Next</dt><dd>${esc(t.next)}</dd>` : ''}
          <dt>Owner</dt><dd>${esc(t.owner)}</dd>
          ${(t.deps || []).length ? `<dt>Needs</dt><dd>${t.deps.map(depChip).join('')}</dd>` : ''}
          ${unblocks.length ? `<dt>Unblocks</dt><dd>${unblocks.map((u) => depChip(u.id)).join('')}</dd>` : ''}
          <dt>Updated</dt><dd>${esc(t.updated)}</dd>
        </dl>
      </div>
    </article>`;
  }

  list.addEventListener('click', (e) => {
    const c = e.target.closest('[data-copy]');
    if (c) { e.stopPropagation(); copy(statusText(byId[c.dataset.copy]), c); return; }
    const go = e.target.closest('[data-go]');
    if (go) { e.stopPropagation(); focusTask(go.dataset.go); return; }
    const row = e.target.closest('.row');
    if (row) {
      const art = row.parentElement; const id = art.dataset.id;
      art.classList.toggle('open');
      art.classList.contains('open') ? open.add(id) : open.delete(id);
      store.set('open', [...open]);
    }
  });

  function focusTask(id) {
    setView('list');
    if (filter !== 'all' || q.value) { filter = 'all'; q.value = ''; renderCounts(); }
    open.add(id); store.set('open', [...open]);
    renderList();
    const el = document.getElementById('t-' + id);
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1400);
  }

  q.addEventListener('input', renderList);
  document.getElementById('expand').addEventListener('click', (e) => {
    const allOpen = tasks.every((t) => open.has(t.id));
    tasks.forEach((t) => allOpen ? open.delete(t.id) : open.add(t.id));
    e.target.textContent = allOpen ? 'Expand all' : 'Collapse all';
    store.set('open', [...open]); renderList();
  });
  document.getElementById('copyall').addEventListener('click', (e) => copy(summaryText(), e.target));

  // ---------- dependency graph ----------
  function renderGraph() {
    const depth = {};
    const d = (id, seen = new Set()) => {
      if (depth[id] != null) return depth[id];
      if (seen.has(id)) return 0;
      seen.add(id);
      const t = byId[id];
      const v = (t.deps || []).filter((x) => byId[x]).reduce((m, x) => Math.max(m, d(x, seen) + 1), 0);
      return (depth[id] = v);
    };
    tasks.forEach((t) => d(t.id));
    const cols = [];
    tasks.forEach((t) => (cols[depth[t.id]] ||= []).push(t));
    const W = 200, H = 46, GX = 70, GY = 12, PAD = 30;
    const pos = {};
    cols.forEach((c, ci) => c.forEach((t, ri) => { pos[t.id] = { x: PAD + ci * (W + GX), y: PAD + 20 + ri * (H + GY) }; }));
    const width = PAD * 2 + cols.length * (W + GX) - GX;
    const height = PAD * 2 + 20 + Math.max(...cols.map((c) => c.length)) * (H + GY);
    const edges = tasks.flatMap((t) => (t.deps || []).filter((x) => pos[x]).map((x) => {
      const a = pos[x], b = pos[t.id];
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      return `<path data-from="${x}" data-to="${t.id}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
    }));
    const nodes = tasks.map((t) => {
      const p = pos[t.id], s = eff(t);
      const title = t.title.length > 28 ? t.title.slice(0, 27) + '…' : t.title;
      return `<g class="node" data-go="${t.id}" transform="translate(${p.x},${p.y})">
        <rect width="${W}" height="${H}" rx="9" style="stroke:var(${COLOR[s]})"/>
        <circle cx="14" cy="${H / 2}" r="4" style="fill:var(${COLOR[s]})"/>
        <text class="nid" x="26" y="18">${t.id} · ${LABEL[s]}</text>
        <text x="26" y="34">${esc(title)}</text></g>`;
    });
    const heads = cols.map((_, ci) => `<text class="col" x="${PAD + ci * (W + GX)}" y="${PAD}">STAGE ${ci + 1}</text>`);
    document.getElementById('graph').innerHTML =
      `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">${heads.join('')}${edges.join('')}${nodes.join('')}</svg>`;
  }
  const graph = document.getElementById('graph');
  graph.addEventListener('click', (e) => { const n = e.target.closest('[data-go]'); if (n) focusTask(n.dataset.go); });
  graph.addEventListener('mouseover', (e) => {
    const n = e.target.closest('.node'); if (!n) return;
    const id = n.dataset.go;
    graph.querySelectorAll('path').forEach((p) => p.classList.toggle('hot', p.dataset.from === id || p.dataset.to === id));
  });

  // ---------- view switch ----------
  function setView(v) {
    document.body.classList.toggle('view-graph', v === 'graph');
    document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
    store.set('view', v);
  }
  document.getElementById('view').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });

  // ---------- log ----------
  document.getElementById('log').innerHTML = [...log].reverse().map((l) => `<li><time>${esc(l.date)}</time><span>${esc(l.text)}</span></li>`).join('');

  renderCounts();
  renderList();
  renderGraph();
  setView(store.get('view', 'list'));
})();
</script>
</body>
</html>
